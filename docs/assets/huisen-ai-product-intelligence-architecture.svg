      <circle cx="182" cy="22" r="12" fill="#5E63E7"/>
      <text x="182" y="26" text-anchor="middle" class="tiny white">2</text>
      <text x="178" y="50" class="medium white">提出假设</text>
      <text x="178" y="69" class="tiny whiteMuted">计划下一步取证</text>
      <path d="M297 40h15" stroke="#7281A8" stroke-width="2" marker-end="url(#arrowLight)"/>

      <rect x="320" width="132" height="80" rx="16" fill="#FFFFFF" opacity="0.08" stroke="#65749C"/>
      <circle cx="342" cy="22" r="12" fill="#6E5DE0"/>
      <text x="342" y="26" text-anchor="middle" class="tiny white">3</text>
      <text x="338" y="50" class="medium white">选择工具</text>
      <text x="338" y="69" class="tiny whiteMuted">自己决定参数</text>
      <path d="M457 40h15" stroke="#7281A8" stroke-width="2" marker-end="url(#arrowLight)"/>

      <rect x="480" width="132" height="80" rx="16" fill="#FFFFFF" opacity="0.08" stroke="#65749C"/>
      <circle cx="502" cy="22" r="12" fill="#7655D9"/>
      <text x="502" y="26" text-anchor="middle" class="tiny white">4</text>
      <text x="498" y="50" class="medium white">验证诊断</text>
      <text x="498" y="69" class="tiny whiteMuted">证据不足则承认</text>
      <path d="M617 40h15" stroke="#7281A8" stroke-width="2" marker-end="url(#arrowLight)"/>

      <rect x="640" width="132" height="80" rx="16" fill="#FFFFFF" opacity="0.08" stroke="#65749C"/>
      <circle cx="662" cy="22" r="12" fill="#397DBB"/>
      <text x="662" y="26" text-anchor="middle" class="tiny white">5</text>
      <text x="658" y="50" class="medium white">最小教学</text>
      <text x="658" y="69" class="tiny whiteMuted">只给必要提示</text>
      <path d="M777 40h15" stroke="#7281A8" stroke-width="2" marker-end="url(#arrowGreen)"/>

      <rect x="800" width="132" height="80" rx="16" fill="#143B3A" stroke="#2D8D75"/>
      <circle cx="822" cy="22" r="12" fill="#18A37C"/>
      <text x="822" y="26" text-anchor="middle" class="tiny white">6</text>
      <text x="818" y="50" class="medium white">重规划 / 停止</text>
      <text x="818" y="69" class="tiny" fill="#BCEBDE">修改后再次验证</text>
    </g>

