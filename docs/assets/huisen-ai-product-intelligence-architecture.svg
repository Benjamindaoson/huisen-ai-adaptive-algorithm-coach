    <text x="92" y="616" font-size="27" font-weight="760" class="white">会验证、会重规划，也知道何时停止</text>
    <text x="92" y="641" font-size="14" class="whiteMuted">每次分析绑定提交快照、运行结果、工具调用与代码差异，不是一次泛聊天。</text>

