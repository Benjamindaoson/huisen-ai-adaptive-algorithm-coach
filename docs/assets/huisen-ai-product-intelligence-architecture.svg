    <rect x="60" y="338" width="1480" height="170" rx="26" fill="url(#orchestrator)"/>
  </g>
  <g>
    <text x="92" y="374" class="layerIndex whiteMuted">02 · LEARNING ORCHESTRATOR</text>
    <text x="92" y="412" font-size="29" font-weight="760" class="white">自适应学习编排器</text>
    <text x="92" y="440" font-size="15" class="whiteMuted">目标、基础、时间与行为证据共同决定下一步；模型不能凭感觉修改掌握度。</text>

    <g transform="translate(92 462)">
