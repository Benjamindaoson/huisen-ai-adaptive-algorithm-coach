      <text x="56" y="52" class="cardBody">先理解你，再安排起点</text>
    </g>
    <path d="M500 239h20" stroke="#C6CEDC" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <g transform="translate(532 204)">
