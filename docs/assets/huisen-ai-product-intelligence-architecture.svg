  </g>
  <g>
    <text x="88" y="934" class="layerIndex">04 · ENGINEERING &amp; SAFETY FOUNDATION</text>
    <text x="88" y="965" class="layerName">工程与安全底座</text>
    <line x1="262" y1="924" x2="262" y2="973" stroke="#E5EAF2"/>

    <g transform="translate(292 927)">
