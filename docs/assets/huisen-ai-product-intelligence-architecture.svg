<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" role="img" aria-labelledby="title description">
  <title id="title">汇森 AI 学习智能系统架构</title>
  <desc id="description">展示学习者体验、自适应学习编排、Mentor Agent 验证循环、可信学习记忆以及工程与安全底座之间的闭环。</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFF"/>
      <stop offset="0.55" stop-color="#F7F8FC"/>
      <stop offset="1" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="orchestrator" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#425BE8"/>
      <stop offset="0.52" stop-color="#5B55E8"/>
      <stop offset="1" stop-color="#7250D9"/>
    </linearGradient>
    <linearGradient id="agentCore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111D35"/>
      <stop offset="1" stop-color="#17233F"/>
    </linearGradient>
    <linearGradient id="memoryGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F1FF"/>
      <stop offset="1" stop-color="#F0F7FF"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#16213A" flood-opacity="0.10"/>
    </filter>
    <filter id="smallShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#16213A" flood-opacity="0.08"/>
    </filter>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#7180A6" opacity="0.14"/>
    </pattern>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4F63E8"/>
    </marker>
    <marker id="arrowLight" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#9FB0FF"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#18A37C"/>
    </marker>
    <style>
      text { font-family: Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; }
      .eyebrow { font-size: 14px; font-weight: 700; letter-spacing: 2.6px; fill: #52617A; }
      .title { font-size: 34px; font-weight: 760; fill: #101828; }
      .subtitle { font-size: 16px; font-weight: 450; fill: #667085; }
      .layerIndex { font-size: 12px; font-weight: 800; letter-spacing: 1.5px; fill: #53627A; }
      .layerName { font-size: 17px; font-weight: 700; fill: #18243B; }
      .cardTitle { font-size: 17px; font-weight: 700; fill: #16223A; }
      .cardBody { font-size: 13px; font-weight: 450; fill: #67748B; }
      .white { fill: #FFFFFF; }
      .whiteMuted { fill: #DDE5FF; }
      .darkMuted { fill: #718096; }
      .tiny { font-size: 12px; font-weight: 600; }
      .small { font-size: 13px; font-weight: 600; }
      .medium { font-size: 15px; font-weight: 650; }
    </style>
  </defs>

  <rect width="1600" height="1060" rx="28" fill="url(#canvas)"/>
  <rect width="1600" height="1060" rx="28" fill="url(#dotGrid)"/>

  <!-- Header -->
  <g>
    <rect x="60" y="48" width="10" height="72" rx="5" fill="#4F63E8"/>
    <text x="92" y="66" class="eyebrow">PRODUCT INTELLIGENCE ARCHITECTURE</text>
    <text x="92" y="106" class="title">汇森 AI · 学习智能系统</text>
    <text x="92" y="134" class="subtitle">把一次真实学习行为，变成下一步可解释、可验证的训练</text>

    <g transform="translate(1000 55)">
      <rect width="164" height="68" rx="18" fill="#EEF2FF" stroke="#DDE4FF"/>
      <circle cx="24" cy="23" r="8" fill="#5268ED"/>
      <text x="42" y="28" class="tiny" fill="#3447B8">01 · 更容易学会</text>
      <text x="22" y="50" class="tiny" fill="#6B7390">理解与动手衔接</text>
    </g>
    <g transform="translate(1178 55)">
      <rect width="164" height="68" rx="18" fill="#F5F0FF" stroke="#E5D9FF"/>
      <circle cx="24" cy="23" r="8" fill="#7655D9"/>
      <text x="42" y="28" class="tiny" fill="#593AAE">02 · 更牢固掌握</text>
      <text x="22" y="50" class="tiny" fill="#6B7390">迁移与延迟复测</text>
    </g>
    <g transform="translate(1356 55)">
      <rect width="184" height="68" rx="18" fill="#ECF9F5" stroke="#CDEFE3"/>
      <circle cx="24" cy="23" r="8" fill="#18A37C"/>
      <text x="42" y="28" class="tiny" fill="#107158">03 · 真正用出来</text>
      <text x="22" y="50" class="tiny" fill="#6B7390">考试与项目证据</text>
    </g>
  </g>

  <!-- Layer 01: experience -->
  <g filter="url(#shadow)">
    <rect x="60" y="168" width="1480" height="134" rx="24" fill="#FFFFFF" stroke="#E2E8F2"/>
  </g>
  <g>
    <text x="88" y="202" class="layerIndex">01 · EXPERIENCE</text>
    <text x="88" y="230" class="layerName">学习者体验</text>
    <text x="88" y="254" class="cardBody">AI 始终工作在任务中，</text>
    <text x="88" y="274" class="cardBody">而不是藏在聊天窗口里。</text>
    <line x1="238" y1="192" x2="238" y2="278" stroke="#E5EAF2"/>

    <g transform="translate(266 204)">
      <rect width="226" height="70" rx="18" fill="#F7F8FF" stroke="#DCE2FF"/>
      <circle cx="28" cy="35" r="17" fill="#E7EBFF"/>
      <path d="M21 35h14M28 28v14" stroke="#4F63E8" stroke-width="2.2" stroke-linecap="round"/>
