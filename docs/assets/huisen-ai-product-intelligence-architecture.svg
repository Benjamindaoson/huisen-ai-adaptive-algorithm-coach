      <circle cx="28" cy="35" r="17" fill="#E7EBFF"/>
      <path d="M22 29h12v12H22zM26 26h12v12" fill="none" stroke="#4F63E8" stroke-width="2"/>
      <text x="56" y="31" class="cardTitle">10 分钟训练舱</text>
      <text x="56" y="52" class="cardBody">微课 · 预测 · 局部编码</text>
    </g>
    <path d="M766 239h20" stroke="#C6CEDC" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <g transform="translate(798 204)">
      <rect width="226" height="70" rx="18" fill="#F7F8FF" stroke="#DCE2FF"/>
      <circle cx="28" cy="35" r="17" fill="#E7EBFF"/>
      <path d="M21 31l-5 4 5 4M35 31l5 4-5 4M31 27l-6 16" fill="none" stroke="#4F63E8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="56" y="31" class="cardTitle">代码工作台</text>
      <text x="56" y="52" class="cardBody">运行后触发上下文诊断</text>
    </g>
    <path d="M1032 239h20" stroke="#C6CEDC" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <g transform="translate(1064 204)">
      <rect width="226" height="70" rx="18" fill="#F7F8FF" stroke="#DCE2FF"/>
      <circle cx="28" cy="35" r="17" fill="#E7EBFF"/>
      <path d="M20 42V28h16v14M18 42h20" fill="none" stroke="#4F63E8" stroke-width="2" stroke-linejoin="round"/>
      <text x="56" y="31" class="cardTitle">考试与项目实训</text>
      <text x="56" y="52" class="cardBody">从算法能力走向真实任务</text>
    </g>
    <path d="M1298 239h20" stroke="#C6CEDC" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <g transform="translate(1330 204)">
      <rect width="182" height="70" rx="18" fill="#F0FBF7" stroke="#CDEFE3"/>
      <circle cx="28" cy="35" r="17" fill="#DDF5ED"/>
      <path d="M19 39l6-7 5 4 8-10M35 26h3v3" fill="none" stroke="#18A37C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="56" y="31" class="cardTitle">成长回放</text>
      <text x="56" y="52" class="cardBody">看见从不会到会</text>
    </g>
  </g>

  <path d="M800 302v24" stroke="#697AED" stroke-width="3" marker-end="url(#arrowBlue)"/>

  <!-- Layer 02: orchestration -->
