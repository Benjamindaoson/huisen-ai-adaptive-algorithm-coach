      <circle cx="22" cy="22" r="12" fill="#4F63E8"/>
      <text x="22" y="26" text-anchor="middle" class="tiny white">1</text>
      <text x="18" y="50" class="medium white">观察上下文</text>
      <text x="18" y="69" class="tiny whiteMuted">代码 · 输出 · 历史</text>
