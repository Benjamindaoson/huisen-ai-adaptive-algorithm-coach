      <text x="648" y="0" class="small" fill="#B8C6ED">代码 Diff</text>
      <circle cx="742" cy="-5" r="2.5" fill="#6D7DA5"/>
      <text x="760" y="0" class="small" fill="#B8C6ED">自动生成测试</text>
    </g>
  </g>

  <!-- Layer 03b: trusted learning memory -->
