        <rect x="210" width="94" height="27" rx="13.5" fill="#F5F0FF"/>
        <text x="257" y="18" text-anchor="middle" class="tiny" fill="#6543B5">进入调试</text>
        <rect x="315" width="94" height="27" rx="13.5" fill="#F5F0FF"/>
        <text x="362" y="18" text-anchor="middle" class="tiny" fill="#6543B5">迁移挑战</text>
        <rect x="420" width="120" height="27" rx="13.5" fill="#E9F8F3"/>
        <text x="480" y="18" text-anchor="middle" class="tiny" fill="#13795E">延迟复测</text>
      </g>
    </g>
  </g>

  <path d="M800 508v22" stroke="#697AED" stroke-width="3" marker-end="url(#arrowBlue)"/>

