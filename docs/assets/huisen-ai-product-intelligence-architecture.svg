    <g transform="translate(895 362)">
      <rect width="615" height="122" rx="21" fill="#FFFFFF" opacity="0.97"/>
      <text x="26" y="32" class="layerIndex" fill="#4A56B6">NEXT BEST ACTION</text>
      <text x="26" y="61" class="cardTitle">此刻最有价值的学习动作</text>
      <g transform="translate(26 78)">
        <rect width="94" height="27" rx="13.5" fill="#EEF1FF"/>
        <text x="47" y="18" text-anchor="middle" class="tiny" fill="#4052C6">先补概念</text>
        <rect x="105" width="94" height="27" rx="13.5" fill="#EEF1FF"/>
