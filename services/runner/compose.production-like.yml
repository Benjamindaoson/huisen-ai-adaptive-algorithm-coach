include:
  - path: docker-compose.yml

services:
  object-store:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-local-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-production-object-store-password}
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - gateway-object-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [platform]

  gateway:
    environment:
      APP_ENV: local-production
      OBJECT_STORE_ENDPOINT: http://object-store:9000
      OBJECT_STORE_BUCKET: learning-artifacts
      OBJECT_STORE_ACCESS_KEY: ${MINIO_ROOT_USER:-local-admin}
      OBJECT_STORE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-local-production-object-store-password}
    depends_on:
      object-store:
        condition: service_healthy

volumes:
  gateway-object-data:
