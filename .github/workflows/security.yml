name: Security Gates

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@24c7eb380a2dc368f2d129e4c65e51d172983a1e # v4, immutable commit
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@24c7eb380a2dc368f2d129e4c65e51d172983a1e

  dependencies-and-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm --prefix web ci
      - run: npm --prefix services/runner/gateway ci
      - run: npm audit --audit-level=high
      - run: npm --prefix web audit --audit-level=high
      - run: npm --prefix services/runner/gateway audit --audit-level=high
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0, immutable commit
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig,license
          severity: HIGH,CRITICAL
          exit-code: "1"

  gateway-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f services/runner/gateway/Dockerfile -t od-runner-gateway:${{ github.sha }} .
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: od-runner-gateway:${{ github.sha }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
